name: Rust checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned toolchain
        run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: python3 -m unittest -v
      - run: node tests/extension_protocol.mjs
      - run: CHROMIUM=google-chrome node tests/browser_smoke.mjs
      - run: python3 scripts/package_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: opendownload-linux-and-browser-extensions
          path: dist/*
