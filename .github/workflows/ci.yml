name: Desktop builds and checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      OPENDOWNLOAD_DIAGNOSTICS: test-results/desktop
      OPENDOWNLOAD_TOOLS_DIR: ${{ github.workspace }}/dist/tools/linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0 libxkbcommon-x11-0 libgl1-mesa-dri libegl1 libx11-6 libxcursor1 libxi6 libxrandr2 xvfb xdotool imagemagick
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Build bundled video helpers
        run: python scripts/prepare_media.py --platform linux
      - run: python tests/run_tests.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node tests/extension_protocol.mjs
      - run: CHROMIUM=google-chrome node tests/browser_smoke.mjs
      - name: Native desktop smoke test
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 python tests/desktop_smoke.py
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-diagnostics-Linux
          path: test-results/desktop/
      - run: python scripts/package_desktop.py --platform linux
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDownload-Linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/opendownload-*.zip
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      OPENDOWNLOAD_DIAGNOSTICS: test-results/desktop
      OPENDOWNLOAD_TOOLS_DIR: ${{ github.workspace }}/dist/tools/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: make mingw-w64-x86_64-gcc
      - name: Build bundled video helpers
        shell: msys2 {0}
        run: python scripts/prepare_media.py --platform windows
      - run: rustup show
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: python tests/run_tests.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node tests/extension_protocol.mjs
      - name: Native Windows desktop smoke test (DirectX software rendering)
        run: python tests/desktop_windows_smoke.py
        env:
          OPENDOWNLOAD_SOFTWARE_RENDERING: '1'
      - name: Upload desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-diagnostics-Windows
          path: test-results/desktop/
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Package desktop and browser companion
        shell: pwsh
        run: |
          $env:PATH += ";${env:ProgramFiles(x86)}\NSIS"
          python scripts/package_desktop.py --platform windows --installer
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDownload-Windows
          path: |
            dist/OpenDownload-Setup-x64.exe
            dist/OpenDownload-Windows-x64.zip
            dist/opendownload-*.zip
