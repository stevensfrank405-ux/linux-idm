<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OpenDownload</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101318;color:#e9edf3}*{box-sizing:border-box}body{margin:0}aside{position:fixed;width:230px;height:100vh;padding:32px 24px;background:#161b22;border-right:1px solid #29303a}.brand{font-size:22px;font-weight:750;letter-spacing:-1px}.logo{color:#79e2b5}aside p{font-size:12px;color:#8e9aaa;margin-bottom:44px}nav button{display:block;width:100%;text-align:left;margin:8px 0;background:transparent;color:#a5afbd}button{border:0;border-radius:8px;padding:12px 16px;cursor:pointer;font:inherit;font-size:14px}nav button.selected{background:#25382f;color:#8ce9bf}.foot{position:absolute;bottom:24px;color:#809082;font-size:12px}main{margin-left:230px;padding:48px;max-width:1400px}.eyebrow{color:#7fe1b4;text-transform:uppercase;letter-spacing:2px;font-size:11px}h1{font-size:32px;letter-spacing:-1px;margin:10px 0}header p{color:#929eae;font-size:14px}.stats{display:flex;gap:18px;margin:32px 0}.stat{flex:1;border:1px solid #2a323e;background:#181e27;padding:22px;border-radius:12px}.stat small{display:block;color:#96a2b2;margin-bottom:10px}.stat strong{font-size:25px}.add{display:flex;gap:10px;margin-bottom:12px}input{width:100%;background:#181e27;border:1px solid #394250;border-radius:9px;padding:15px;color:white;font:inherit}.primary{background:#8be5bb;color:#10291c;white-space:nowrap;font-weight:650}h2{font-size:17px;margin:32px 0 20px}.row{border:1px solid #2a323e;padding:20px;border-radius:12px;background:#181e27;margin-bottom:12px}.top{display:flex;align-items:center;gap:16px}.icon{background:#253b33;color:#9be6c4;padding:12px;border-radius:10px}.info{flex:1;min-width:0}.name{font-size:14px;font-weight:600;overflow-wrap:anywhere}.meta{font-size:12px;color:#96a2b2;margin:7px 0}.action{background:#2b3542;color:#e1e8f2}.track{height:5px;background:#303948;border-radius:5px;margin-top:16px;overflow:hidden}.bar{height:100%;background:#87e4b9;transition:width .4s}.empty{text-align:center;padding:65px 20px;border:1px dashed #394250;border-radius:12px;color:#96a2b2}.empty strong{display:block;color:#d4dce6;margin:12px}.error{color:#ffa9a9;font-size:13px;overflow-wrap:anywhere}#connection{font-size:12px;color:#f1c977}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid #8be5bb;outline-offset:3px}@media(max-width:750px){aside{position:static;width:auto;height:auto;padding:20px}aside p,.foot{display:none}nav{display:flex;gap:8px}nav button{width:auto}main{margin:0;padding:24px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:20px}.add{flex-direction:column}}
</style></head><body><aside><div class="brand"><span class="logo">↓</span> OpenDownload</div><p>YOUR FILES. YOUR FREEDOM.</p><nav aria-label="Download filters"><button class="selected" data-filter="all">▦ &nbsp; All downloads</button><button data-filter="downloading">↓ &nbsp; Downloading</button><button data-filter="paused">Ⅱ &nbsp; Paused</button><button data-filter="completed">✓ &nbsp; Completed</button><button data-filter="failed">! &nbsp; Failed</button></nav><div class="foot">● Free & open source<br><br>Built for Linux. Open to everyone.</div></aside><main><header><div class="eyebrow">A little less waiting</div><h1>Your downloads, in control.</h1><p>A free download manager for Linux. No subscriptions. No distractions.</p></header><section class="stats" aria-label="Download statistics"><div class="stat"><small>Download speed</small><strong id="speed">0 B/s</strong></div><div class="stat"><small>In progress</small><strong id="active">0</strong></div><div class="stat"><small>Completed</small><strong id="done">0</strong></div></section><form id="form" class="add"><input id="url" type="url" placeholder="Paste a download link (https://...)" aria-label="Download URL" required><button class="primary" id="add">+ Add download</button></form><div id="error" class="error" role="alert"></div><div id="connection" role="status"></div><h2 id="heading">All downloads</h2><section id="list" aria-label="Downloads"></section></main><script>
const token='__TOKEN__';let filter='all',jobs=[];
const el=id=>document.getElementById(id);
function bytes(n){if(n==null)return 'Unknown size';const units=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return `${n.toFixed(i?1:0)} ${units[i]}`}
async function api(path,data){const response=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'X-Token':token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const result=await response.json();if(!response.ok)throw Error(result.error||'Request failed');return result}
function node(tag,cls,text){const e=document.createElement(tag);e.className=cls;e.textContent=text;return e}
function render(){el('speed').textContent=bytes(jobs.reduce((s,j)=>s+j.speed,0))+'/s';el('active').textContent=jobs.filter(j=>j.status==='downloading').length;el('done').textContent=jobs.filter(j=>j.status==='completed').length;el('list').replaceChildren();const visible=jobs.filter(j=>filter==='all'||j.status===filter);if(!visible.length){const e=node('div','empty','Paste a link above to start your next download.');e.prepend(node('strong','','Nothing here yet'));el('list').append(e)}for(const j of visible){const row=node('article','row',''),top=node('div','top',''),info=node('div','info','');info.append(node('div','name',j.name),node('div','meta',`${j.status} · ${bytes(j.downloaded)} / ${bytes(j.total)}${j.status==='downloading'?' · '+bytes(j.speed)+'/s':''}`));top.append(node('div','icon',j.status==='completed'?'✓':'↓'),info);if(j.status!=='completed'){const button=node('button','action',j.status==='downloading'?'Pause':j.status==='failed'?'Retry':'Resume');button.onclick=async()=>{button.disabled=true;try{await api(j.status==='downloading'?'pause':'resume',{id:j.id});await refresh()}catch(e){el('error').textContent=e.message}finally{button.disabled=false}};top.append(button)}row.append(top);const track=node('div','track',''),bar=node('div','bar','');bar.style.width=(j.total?Math.min(100,j.downloaded/j.total*100):0)+'%';track.append(bar);row.append(track);if(j.error)row.append(node('div','error',j.error));el('list').append(row)}}
async function refresh(){try{jobs=await api('downloads');el('connection').textContent='';render()}catch(e){el('connection').textContent='Cannot reach the download manager. Check that the app is running.'}}
el('form').onsubmit=async e=>{e.preventDefault();el('add').disabled=true;el('error').textContent='';try{await api('add',{url:el('url').value.trim()});el('url').value='';await refresh()}catch(e){el('error').textContent=e.message}finally{el('add').disabled=false}};
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b===button));el('heading').textContent=button.textContent.slice(1).trim();render()});refresh();setInterval(refresh,1000);
</script></body></html>
