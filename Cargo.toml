[package]
name = "opendownload"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A free native desktop download manager for Windows and Linux"

[dependencies]
axum = "0.8"
dirs = "6"
futures-util = "0.3"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "wgsl"] }

[build-dependencies]
winresource = "0.1"
